# Gitee Go pipeline — calls the same scripts/ci.sh as GitHub Actions, so
# there is exactly one definition of "the quality gate".
#
# golangVersion must be >= the `go` directive in go.mod (1.27.3); Gitee Go
# resolves a minor version to its latest available patch release.
version: "1.0"
name: ci
displayName: CI
stages:
- name: quality-gate
  displayName: 质量门禁
  strategy: naturally
  trigger: auto
  steps:
  - step: build@golang
    name: ci
    displayName: gofmt + vet + build + test -race + cross-compile + govulncheck
    golangVersion: "1.27.3"
    commands:
    - "go version"
    - "bash scripts/ci.sh"
    artifacts: []
    caches:
    - /go/pkg/mod
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    branches:
      prefix:
      - "master"
      precise: []
      include: []
notify: []
