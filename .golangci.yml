# golangci-lint v2 configuration
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  # Default linter set (errcheck, govet, ineffassign, staticcheck, unused, ...).
  # `all` would enable style linters that generate noise unrelated to correctness.
  default: standard

  # staticcheck runs with its default check set. We do NOT set
  # `staticcheck.checks: all` — the ST1xxx style checks (missing package
  # comments, comment form, naming) are intentionally not enabled.
  settings:
    errcheck:
      # fmt.Fprint* are excluded because every call in this project writes to
      # a tabwriter buffer or os.Stdout/os.Stderr — never a file/socket/pipe —
      # so the unchecked return values carry no signal. errcheck still checks
      # every other unchecked error (resp.Body.Close, os.Remove, json.Indent,
      # io.Copy, ...), which is where real bugs hide.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # Test files: unchecked (json.Encode|w.Write|w.Close|ParseFlags|fmt.Sscanf)
      # return values are standard in test helpers — test failures surface the
      # problem. fmt.Fprint* are already excluded globally above.
      - path: '(.+)_test\.go$'
        linters:
          - errcheck

issues:
  # Do not cap or collapse output — show every issue.
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  tests: true
